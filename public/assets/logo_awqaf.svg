<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140" fill="none">
  <!-- General Authority for Awqaf (الهيئة العامة للأوقاف - أوقاف AWQAF) -->
  
  <!-- Left Side: Typography "أوقاف AWQAF" -->
  <g transform="translate(16, 22)">
    <!-- Arabic word "أوقاف" in authentic geometric bold lettering -->
    <text x="175" y="48" text-anchor="end" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="50" fill="#1C4538" letter-spacing="-1">
      أوقاف
    </text>

    <!-- English word "AWQAF" -->
    <text x="175" y="86" text-anchor="end" font-family="'Inter', 'Cairo', sans-serif" font-weight="800" font-size="28" fill="#1C4538" letter-spacing="3.5">
      AWQAF
    </text>
  </g>

  <!-- Right Side: Official Saudi Awqaf Shield Emblem -->
  <g transform="translate(205, 12)">
    <!-- Outer Shield Frame -->
    <path d="M50 2 C72 2 92 18 92 45 C92 78 68 98 50 110 C32 98 8 78 8 45 C8 18 28 2 50 2 Z" 
          fill="#1C4538" stroke="#D3B88C" stroke-width="2.5" />
    
    <!-- Inner Fine Gold Crest Line -->
    <path d="M50 7 C69 7 86 21 86 45 C86 74 65 92 50 103 C35 92 14 74 14 45 C14 21 31 7 50 7 Z" 
          fill="none" stroke="#D3B88C" stroke-width="1.2" opacity="0.8" />
    
    <!-- Saudi Palm Tree in Warm Gold -->
    <g transform="translate(32, 18)">
      <!-- Palm Trunk -->
      <path d="M18 25 Q17 40 18 52" stroke="#D3B88C" stroke-width="3" stroke-linecap="round" />
      <line x1="13" y1="34" x2="23" y2="32" stroke="#D3B88C" stroke-width="1.4" />
      <line x1="14" y1="41" x2="22" y2="39" stroke="#D3B88C" stroke-width="1.4" />
      <line x1="14" y1="48" x2="22" y2="46" stroke="#D3B88C" stroke-width="1.4" />
      
      <!-- Palm Fronds (Natural Arched) -->
      <path d="M18 25 C14 18 6 20 0 25" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M18 25 C12 12 4 11 0 14" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M18 25 C15 7 11 5 7 2" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M18 25 C21 7 25 5 29 2" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M18 25 C24 12 32 11 36 14" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M18 25 C22 18 30 20 36 25" stroke="#D3B88C" stroke-width="2" fill="none" stroke-linecap="round" />
      
      <!-- Dates clusters -->
      <circle cx="14" cy="27" r="1.8" fill="#D3B88C" />
      <circle cx="22" cy="27" r="1.8" fill="#D3B88C" />
    </g>

    <!-- Crossed Curved Swords in Warm Gold -->
    <g transform="translate(18, 56)">
      <!-- Sword 1 (Curves up-left) -->
      <path d="M10 26 C16 22 32 14 54 4" stroke="#D3B88C" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Sword 1 Hilt & Guard -->
      <circle cx="8.5" cy="27.5" r="2.2" fill="#D3B88C" />
      <line x1="5" y1="23" x2="13" y2="30" stroke="#D3B88C" stroke-width="2.2" stroke-linecap="round" />

      <!-- Sword 2 (Curves up-right) -->
      <path d="M54 26 C48 22 32 14 10 4" stroke="#D3B88C" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Sword 2 Hilt & Guard -->
      <circle cx="55.5" cy="27.5" r="2.2" fill="#D3B88C" />
      <line x1="51" y1="30" x2="59" y2="23" stroke="#D3B88C" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
